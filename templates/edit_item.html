{% extends "base.html" %}

{% block title %}

Edit Item

{% endblock %}

{% block content %}

<section class="form-section">

<div class="container">

<h1>

Edit Marketplace Item

</h1>

<form
method="POST"
enctype="multipart/form-data">

<label>Title</label>

<input
type="text"
name="title"
value="{{ item['title'] }}"
required>

<label>Description</label>

<textarea
name="description"
required>{{ item['description'] }}</textarea>

<label>Category</label>

<input
type="text"
name="category"
value="{{ item['category'] }}">

<label>Condition</label>

<input
type="text"
name="condition"
value="{{ item['condition'] }}">

<label>Price</label>

<input
type="number"
step="0.01"
name="price"
value="{{ item['price'] }}">

<label>Replace Image</label>

<input
type="file"
name="image">

<button
class="btn btn-primary">

Update Item

</button>

</form>

</div>

</section>

{% endblock %}
