{% extends "base.html" %}

{% block title %}

My Listings

{% endblock %}

{% block content %}

<section class="dashboard-section">

<div class="container">

<h1>

My Marketplace Listings

</h1>

<table class="listing-table">

<tr>

<th>Image</th>

<th>Title</th>

<th>Price</th>

<th>Status</th>

<th>Actions</th>

</tr>

{% for item in items %}

<tr>

<td>

<img
src="{{ url_for('static', filename='uploads/' + (item['image'] or 'placeholder.png')) }}"
width="80">

</td>

<td>

{{ item["title"] }}

</td>

<td>

₹{{ item["price"] }}

</td>

<td>

{{ item["status"] }}

</td>

<td>

<a href="{{ url_for('edit_item', item_id=item['id']) }}">

Edit

</a>

|

<form
method="POST"
action="{{ url_for('delete_item', item_id=item['id']) }}"
style="display:inline;"
onsubmit="return confirm('Are you sure you want to delete this listing?');">

    <button class="btn btn-danger">

        Delete

    </button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</section>

{% endblock %}
