{% extends "base.html" %}

{% block title %}
Login | KindKart
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <h2>Welcome Back 👋</h2>

            <p>

                Login to continue using KindKart.

            </p>

            <form method="POST" action="/login">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    Login

                </button>

            </form>

            <p class="auth-footer">

                Don't have an account?

                <a href="/register">

                    Register

                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
