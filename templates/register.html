{% extends "base.html" %}

{% block title %}
Register | KindKart
{% endblock %}

{% block content %}

<section class="auth-section">

<div class="container">

<div class="auth-card">

<h2>Create Account</h2>

<p>Join the KindKart Community</p>

<form action="/register" method="POST">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="full_name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="text"
name="phone">

</div>

<div class="form-group">

<label>College</label>

<input
type="text"
name="college">

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
required>

</div>

<button
class="btn btn-primary"
type="submit">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</div>

</section>

{% endblock %}
